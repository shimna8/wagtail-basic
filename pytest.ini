[pytest]
# Pytest configuration for Django/Wagtail project

# Django settings module for tests
DJANGO_SETTINGS_MODULE = voyah.settings.development

# Python files to search for tests
python_files = tests.py test_*.py *_tests.py

# Python classes to search for tests
python_classes = Test* *Tests

# Python functions to search for tests
python_functions = test_*

# Directories to search for tests
testpaths = 
    home
    search
    tests

# Minimum version of pytest required
minversion = 7.0

# Additional command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on unknown config options
    --strict-config
    # Coverage options
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below threshold
    --cov-fail-under=80
    # Show warnings
    --disable-warnings
    # Reuse database between tests for speed
    --reuse-db
    # Run tests in parallel (adjust number based on CPU cores)
    # -n auto
    # Show slowest tests
    --durations=10

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    django_db: marks tests that require database access
    wagtail: marks tests specific to Wagtail functionality
    models: marks tests for model functionality
    views: marks tests for view functionality
    forms: marks tests for form functionality
    api: marks tests for API functionality
    admin: marks tests for admin functionality

# Ignore certain warnings
filterwarnings =
    # Ignore deprecation warnings from third-party packages
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Show warnings from your own code
    default::DeprecationWarning:voyah.*
    default::DeprecationWarning:home.*
    default::DeprecationWarning:search.*

# Django-specific settings
django_find_project = false

# Console output style
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
# timeout = 300

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Coverage options
[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    manage.py
    */wsgi.py
    */asgi.py
    */settings/*
    */apps.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov


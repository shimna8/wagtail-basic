[metadata]
name = voyah
version = 1.0.0
description = A Wagtail CMS project with Django
author = Your Name
author_email = your.email@example.com
url = https://github.com/yourusername/voyah
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.1
    Framework :: Wagtail
    Framework :: Wagtail :: 6
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
python_requires = >=3.10
include_package_data = True
zip_safe = False

# Flake8 configuration
[flake8]
max-line-length = 100
max-complexity = 10
exclude =
    .git,
    __pycache__,
    */migrations/*,
    */static/*,
    */media/*,
    venv,
    env,
    .venv,
    .env,
    build,
    dist,
    *.egg-info,
    .tox,
    .pytest_cache,
    .mypy_cache,
    htmlcov,
    node_modules

# Extend default ignore list
extend-ignore = 
    E203,  # whitespace before ':'
    E266,  # too many leading '#' for block comment
    E501,  # line too long (handled by black)
    W503,  # line break before binary operator
    W504,  # line break after binary operator
    E402,  # module level import not at top of file
    F401,  # imported but unused (in __init__.py files)

# Per-file ignores
per-file-ignores =
    __init__.py:F401,F403
    settings/*.py:E501,F405
    */migrations/*.py:E501

# Show source code for errors
show-source = True

# Show error codes in output
show-pep8 = True

# Count errors
count = True

# Statistics
statistics = True

# isort configuration
[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip_glob =
    */migrations/*
    */static/*
    */media/*
    venv/*
    env/*
    .venv/*
    node_modules/*
known_django = django
known_wagtail = wagtail
known_first_party = voyah,home,search
sections = FUTURE,STDLIB,DJANGO,WAGTAIL,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY

# Black configuration
[tool:black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | node_modules
)/
'''

# Coverage configuration
[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    manage.py
    */wsgi.py
    */asgi.py
    */settings/*
    */apps.py
    */admin.py
branch = True
parallel = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

# MyPy configuration
[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
ignore_missing_imports = True
plugins = 
    mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = voyah.settings.development

[mypy-*.migrations.*]
ignore_errors = True

[mypy-*.tests.*]
ignore_errors = True

# Pylint configuration
[pylint]
max-line-length = 100
disable =
    C0111,  # missing-docstring
    C0103,  # invalid-name
    R0903,  # too-few-public-methods
    R0913,  # too-many-arguments
    W0212,  # protected-access
    C0330,  # bad-continuation
    C0326,  # bad-whitespace

[pylint.MASTER]
ignore = migrations,tests,venv,env,.venv,node_modules
load-plugins = pylint_django

[pylint.DESIGN]
max-parents = 13

[pylint.TYPECHECK]
generated-members = objects,DoesNotExist,id,pk,_meta,MultipleObjectsReturned

# Bandit security linter configuration
[bandit]
exclude_dirs = 
    /tests/,
    /migrations/,
    /venv/,
    /env/,
    /.venv/
skips = B101,B601

# Tool-specific settings
[tool:pytest]
DJANGO_SETTINGS_MODULE = voyah.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = home search tests
addopts = -v --reuse-db

[bdist_wheel]
universal = 0

[aliases]
test = pytest

